name: Review priority corrections and predictive parity
on:
  push:
    paths:
      - 'first_piece/**'
      - 'setharkk/**'
      - 'validation/revision_fix_probe.py'
      - '.github/workflows/revision-fixes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixes:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing regressions and priority correction invariants
        run: python -m unittest discover -s first_piece/tests -v
      - name: Verified corrections, parity and unprofiled before after measurements
        run: python -m validation.revision_fix_probe --out "${{ runner.temp }}/revision-fixes.json"
      - name: Upload correction evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: revision-fixes-${{ matrix.os }}
          path: ${{ runner.temp }}/revision-fixes.json
          if-no-files-found: warn
