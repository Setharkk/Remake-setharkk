name: First piece laboratory
on:
  push:
    paths:
      - 'first_piece/**'
      - 'setharkk/**'
      - '.github/workflows/first-piece.yml'
  pull_request:
    paths:
      - 'first_piece/**'
      - 'setharkk/**'
      - '.github/workflows/first-piece.yml'
permissions:
  contents: read
jobs:
  laboratory:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: World, evidence and checkpoint tests
        run: python -m unittest discover -s first_piece/tests -v
      - name: Shared cortex and agents integration probe
        run: python -m first_piece.integration_probe --out "${{ runner.temp }}/first-piece-integration.json"
      - name: Upload integration evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-piece-integration-${{ matrix.os }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/first-piece-integration.json
      - name: Reproduce first-piece review before and after correction
        run: python -m first_piece.review_probe --out "${{ runner.temp }}/first-piece-review.json"
      - name: Upload first-piece review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: first-piece-review-${{ matrix.os }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/first-piece-review.json
      - name: Audit available information and noise control
        id: audit
        run: python -m first_piece.audit --seeds 0 1 2 3 4 --horizons 100 1000 10000 --out "${{ runner.temp }}/first-piece"
      - name: Learning, ablation, transfer and retention
        id: learning
        run: python -m first_piece.learning_run --seeds 0 1 2 3 4 --out "${{ runner.temp }}/first-piece-learning"
      - name: Temporal order, hidden changes and bounded revisions
        id: temporal
        run: python -m first_piece.temporal_run --seeds 0 1 2 3 4 --out "${{ runner.temp }}/first-piece-temporal"
      - name: Upload complete temporal state
        if: ${{ always() && (steps.temporal.outcome == 'success' || steps.temporal.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: first-piece-temporal-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/first-piece-temporal/
      - name: Upload complete learning state
        if: ${{ always() && (steps.learning.outcome == 'success' || steps.learning.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: first-piece-learning-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/first-piece-learning/
      - name: Upload laboratory audit
        if: ${{ always() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: first-piece-${{ matrix.os }}
          if-no-files-found: error
          path: ${{ runner.temp }}/first-piece/
