name: Independent plastic revision evidence
on:
  push:
    paths:
      - 'first_piece/**'
      - 'setharkk/**'
      - 'validation/plastic_revision_group.py'
      - 'validation/plastic_revision_probe.py'
      - 'PLASTIC_REVISION_PROTOCOL.md'
      - '.github/workflows/plastic-revision-cases.yml'
  pull_request:
    paths:
      - 'first_piece/**'
      - 'setharkk/**'
      - 'validation/plastic_revision_group.py'
      - 'validation/plastic_revision_probe.py'
      - 'PLASTIC_REVISION_PROTOCOL.md'
      - '.github/workflows/plastic-revision-cases.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  case:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [retention, successive_changes, variable_noise, ablations, scale]
        seed: [0, 1, 2]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: One independent case with the unchanged protocol functions
        run: python -m validation.plastic_revision_group --group "${{ matrix.group }}" --seed "${{ matrix.seed }}" --out "${{ runner.temp }}/case.json"
      - name: Upload full evidence including failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plastic-case-${{ matrix.os }}-${{ matrix.group }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/case.json
          if-no-files-found: warn
