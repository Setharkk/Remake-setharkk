name: Cooperative failure recovery preflight
on:
  push:
    paths:
      - 'validation/recovery_bundle.json'
      - '.github/workflows/cooperative-recovery-review.yml'
      - 'validation/recovery_probe.py'
permissions:
  contents: read
jobs:
  recovery:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce interrupted feedback on published reference
        run: python -m validation.recovery_probe
      - name: Apply exact recovery candidate
        run: python -m validation.readiness_probe --apply validation/recovery_bundle.json
      - name: Recovery and all continuation invariants
        run: python -m unittest first_piece.tests.test_readiness -v
