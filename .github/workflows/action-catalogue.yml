name: Action catalogue S2
on:
  push:
    branches: [main]
    paths:
      - 'first_piece/**'
      - 'validation/action_probe.py'
      - '.github/workflows/action-catalogue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing and extended regression suite
        run: python -m unittest discover -s first_piece/tests -v
      - name: Direct and cooperative multi-action parity
        run: python -m validation.action_probe --quick --out actions.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-catalogue-${{ matrix.os }}
          path: actions.json
